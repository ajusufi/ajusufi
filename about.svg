  <text x="30" y="185" fill="#f2f2f2" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Heyo! I&apos;m Altin, AI student at JKU Linz - currently in my 5th semester.</text>
  <text x="30" y="225" fill="#f2f2f2" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">I love music and I love solving problems. Most of the time I&apos;m doing both at the same time.</text>
  <text x="30" y="265" fill="#f2f2f2" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">I&apos;m also part of JKU&apos;s Formula Student team, where I work on autonomous driving :D</text>
  <text x="30" y="320" fill="#a6a6a6" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Current focus: machine learning, robotics, and embedded systems.</text>
