<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Altin Jusufi terminal introduction</title>
  <desc id="description">A monochrome Linux terminal showing whoami and current focus commands.</desc>

  <rect width="1200" height="520" fill="#0b0b0b"/>
  <rect width="1200" height="78" fill="#1b1b1b"/>
  <line x1="0" y1="78" x2="1200" y2="78" stroke="#303030" stroke-width="2"/>

